<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="45" ry="55" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="35" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>

  <!-- Left Ear -->
  <path d="M 75 50 L 65 25 L 85 45 Z" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>
  <path d="M 75 48 L 70 32 L 82 45 Z" fill="#FFB870"/>

  <!-- Right Ear -->
  <path d="M 125 50 L 135 25 L 115 45 Z" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>
  <path d="M 125 48 L 130 32 L 118 45 Z" fill="#FFB870"/>

  <!-- Left Eye -->
  <ellipse cx="88" cy="68" rx="6" ry="10" fill="#2C3E50"/>
  <ellipse cx="89" cy="65" rx="2" ry="3" fill="white"/>

  <!-- Right Eye -->
  <ellipse cx="112" cy="68" rx="6" ry="10" fill="#2C3E50"/>
  <ellipse cx="113" cy="65" rx="2" ry="3" fill="white"/>

  <!-- Nose -->
  <path d="M 100 78 L 95 83 L 100 85 L 105 83 Z" fill="#E07A3C"/>

  <!-- Mouth -->
  <path d="M 100 85 Q 95 88 90 87" stroke="#E07A3C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 85 Q 105 88 110 87" stroke="#E07A3C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers Left -->
  <line x1="70" y1="75" x2="45" y2="72" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="45" y2="80" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="85" x2="45" y2="88" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers Right -->
  <line x1="130" y1="75" x2="155" y2="72" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="80" x2="155" y2="80" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="85" x2="155" y2="88" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left Arm -->
  <ellipse cx="70" cy="130" rx="12" ry="25" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>
  <ellipse cx="70" cy="150" rx="10" ry="8" fill="#FFB870"/>

  <!-- Right Arm -->
  <ellipse cx="130" cy="130" rx="12" ry="25" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>
  <ellipse cx="130" cy="150" rx="10" ry="8" fill="#FFB870"/>

  <!-- Left Leg -->
  <ellipse cx="85" cy="160" rx="10" ry="20" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>
  <ellipse cx="85" cy="178" rx="12" ry="8" fill="#FFB870"/>

  <!-- Right Leg -->
  <ellipse cx="115" cy="160" rx="10" ry="20" fill="#FF9F45" stroke="#E07A3C" stroke-width="2"/>
  <ellipse cx="115" cy="178" rx="12" ry="8" fill="#FFB870"/>

  <!-- Tail -->
  <path d="M 140 140 Q 170 130 175 110 Q 180 90 170 75"
        stroke="#FF9F45" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 140 140 Q 170 130 175 110 Q 180 90 170 75"
        stroke="#E07A3C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Belly -->
  <ellipse cx="100" cy="130" rx="25" ry="35" fill="#FFE4C4" opacity="0.6"/>

  <!-- Stripes on head -->
  <path d="M 80 55 Q 85 50 90 55" stroke="#E07A3C" stroke-width="1.5" fill="none"/>
  <path d="M 110 55 Q 115 50 120 55" stroke="#E07A3C" stroke-width="1.5" fill="none"/>
</svg>
